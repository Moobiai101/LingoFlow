name = "lingoflow"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-10-19"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist/web"
binding = "ASSETS"

[vars]
LINGOFLOW_MODE = "live"
ELEVENLABS_BASE_URL = "https://api.elevenlabs.io"
ELEVENLABS_AGENT_ID = "agent_6301m5a9tmy2ff288v64c3batzzd"
ELEVENLABS_VOICE_ID = "JBFqnCBsd6RMkjVDRZzb"
LINGOFLOW_PROVIDER_TIMEOUT_MS = "12000"
LINGOFLOW_PROVIDER_RETRIES = "2"

[[d1_databases]]
binding = "DB"
database_name = "lingoflow"
database_id = "bc17dc3f-f2da-478a-ac08-8e8f19dd64c5"
migrations_dir = "migrations"

[observability]
enabled = true

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "2026101901"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "VOICE_LIMITER"
namespace_id = "2026101902"

  [ratelimits.simple]
  limit = 20
  period = 60
